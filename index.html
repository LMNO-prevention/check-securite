<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check Sécurité Rayon</title>
  <meta name="theme-color" content="#78BE20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Check Sécurité">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin:0; height:100%; background:#F4F6F8; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#2c3e50; }
    #app { position:fixed; inset:0; border:0; width:100%; height:100%; background:#F4F6F8; padding-top:env(safe-area-inset-top); box-sizing:border-box; }
    #splash, #hors-ligne { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; background:#F4F6F8; }
    #splash img, #hors-ligne img { width:96px; height:96px; border-radius:22px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    #hors-ligne { display:none; }
    .gears { width:90px; height:60px; }
    .g1 { animation: tourne 4.8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .g2 { animation: tourne 3.2s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    a.btn { display:inline-block; background:#78BE20; color:#fff; text-decoration:none; font-weight:700; padding:12px 20px; border-radius:8px; }
    #secours { display:none; font-size:13px; color:#666; }
    #secours a { color:#599213; font-weight:700; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="">
    <svg class="gears" viewBox="0 0 150 100" aria-hidden="true">
      <g transform="translate(45 50)"><g class="g1"><circle r="30" fill="none" stroke="#78BE20" stroke-width="9" stroke-dasharray="9 6.7"/><circle r="22" fill="#78BE20"/><circle r="9" fill="#F4F6F8"/></g></g>
      <g transform="translate(95 50)"><g class="g2"><circle r="20" fill="none" stroke="#2C3E50" stroke-width="8" stroke-dasharray="8 7.7"/><circle r="14" fill="#2C3E50"/><circle r="6" fill="#F4F6F8"/></g></g>
    </svg>
    <div id="titre" style="font-weight:700;">Check Sécurité Rayon</div>
    <div id="secours">Le chargement est long… <a id="lien-direct" href="#" target="_top">Ouvrir directement</a></div>
  </div>

  <div id="hors-ligne">
    <img src="icons/icon-192.png" alt="">
    <h2 style="margin:0;">Pas de réseau</h2>
    <p style="max-width:320px;margin:0;">L'application a besoin d'une connexion pour s'ouvrir. Reconnectez-vous, puis réessayez.<br/>Un contrôle déjà commencé reste conservé sur cet appareil.</p>
    <a class="btn" href="#" onclick="location.reload();return false;">Réessayer</a>
  </div>

  <iframe id="app" title="Check Sécurité Rayon" allow="camera; microphone; geolocation; clipboard-write" style="display:none"></iframe>

  <script src="config.js"></script>
  <script>
    (function () {
      const cfg = window.APP_CONFIG || {};
      const url = cfg.APP_URL || '';
      const iframe = document.getElementById('app');
      if (cfg.NOM) { document.getElementById('titre').textContent = cfg.NOM; document.title = cfg.NOM; }
      document.getElementById('lien-direct').href = url;

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

      function ouvrir() {
        if (!navigator.onLine) { document.getElementById('splash').style.display = 'none'; document.getElementById('hors-ligne').style.display = 'flex'; return; }
        if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) {
          document.getElementById('titre').textContent = "Adresse de l'application non renseignée (fichier config.js)";
          return;
        }
        document.getElementById('hors-ligne').style.display = 'none';
        document.getElementById('splash').style.display = 'flex';
        iframe.onload = function () {
          iframe.style.display = 'block';
          document.getElementById('splash').style.display = 'none';
        };
        iframe.src = url;
        setTimeout(function () { document.getElementById('secours').style.display = 'block'; }, 12000);
      }
      window.addEventListener('online', function () { if (!iframe.src) ouvrir(); });
      ouvrir();
    })();
  </script>
</body>
</html>
